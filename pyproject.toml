[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "poetry-vocabulary-tools"
version = "0.1.0"
description = "Small local helpers for the poetry vocabulary workflow"
requires-python = ">=3.14,<3.15"
dependencies = ["Pillow==12.1.1"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["tools", "tools.*"]
exclude = ["tools.tests", "tools.tests.*"]
namespaces = false
